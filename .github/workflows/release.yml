# Builds the VS Code extension with the daemon binaries for every platform bundled inside, and
# publishes the .vsix (plus standalone binaries) as a GitHub Release, then (tags only) to the
# Visual Studio Marketplace from a separate job that holds nothing but a per-run Entra ID token.
#
# Trigger: push a tag like v0.2.0, or run manually from the Actions tab (produces a pre-release
# named after the commit).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Work out the version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      - name: Stamp package.json version
        run: npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Cross-compile vineyardd for all platforms
        # Stamped v<version>, as every daemon so far reports it.
        run: VERSION="v${{ steps.ver.outputs.version }}" sh scripts/build-daemon.sh

      # Daemons install a build only with a signature from a release key compiled into them
      # (daemon/internal/release). Every build is signed with both keys; a missing secret fails the
      # release rather than shipping binaries the fleet would refuse. See SECURITY.md.
      - name: Sign daemon binaries
        env:
          VINEYARD_SIGNING_KEY_A: ${{ secrets.VINEYARD_SIGNING_KEY_A }}
          VINEYARD_SIGNING_KEY_B: ${{ secrets.VINEYARD_SIGNING_KEY_B }}
        run: |
          reported="$(bin/vineyardd-linux-amd64 version)"
          echo "binaries report $reported"
          cd daemon && go run ./cmd/vineyard-sign -version "$reported" ../bin/vineyardd-*

      - name: Tests
        run: |
          npm run typecheck
          node --test 'test/**/*.test.ts'
          cd daemon && go test ./...

      - name: Bundle extension
        run: node esbuild.mjs --production

      - name: Package .vsix (binaries included)
        run: npx vsce package --no-dependencies -o "vineyard-${{ steps.ver.outputs.version }}.vsix"

      # Packaging must not have replaced a build after it was signed: every binary shipped, in the
      # release and inside the .vsix, has to match its signature.
      - name: Check every build against its signature
        run: cd daemon && go run ./cmd/vineyard-sign -verify ../bin/vineyardd-*

      - name: Checksums
        run: |
          cp bin/* .
          sha256sum vineyard-*.vsix vineyardd-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: vineyard-${{ steps.ver.outputs.version }}
          path: |
            vineyard-*.vsix
            vineyardd-*
            SHA256SUMS.txt

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', steps.ver.outputs.version) }}
          name: Vineyard ${{ steps.ver.outputs.version }}
          prerelease: ${{ steps.ver.outputs.prerelease }}
          generate_release_notes: true
          files: |
            vineyard-*.vsix
            vineyardd-*
            SHA256SUMS.txt
          body: |
            **Install the extension:** download `vineyard-${{ steps.ver.outputs.version }}.vsix`, then in VS Code run
            *Extensions: Install from VSIX…* (or `code --install-extension vineyard-${{ steps.ver.outputs.version }}.vsix`).
            The daemon binaries for macOS (arm64, x64), Linux and Windows (arm64, x64, x86) are bundled inside; the extension
            installs the right one when you run **Set Up This Machine**, **Join Fleet with Invite Code** or **Add Machine**.

            The standalone `vineyardd-*` binaries are the same builds, for manual installs (`vineyardd init && vineyardd install`).

  # Publishing runs apart from the build: it checks out nothing and installs nothing but a pinned vsce,
  # so no dependency code shares a job with the publishing identity. The identity is a Microsoft Entra
  # app whose federated credential trusts only this repository's "release" environment; azure/login
  # exchanges this run's GitHub OIDC token for a short-lived Entra token, and vsce publishes with it.
  # There is no stored Marketplace secret. Until AZURE_CLIENT_ID is set (a repository variable), it
  # falls back to the VSCE_PAT secret, which Microsoft stops accepting on 2026-12-01.
  marketplace:
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # lets azure/login ask GitHub for this run's OIDC token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vineyard-${{ needs.release.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Sign in to Microsoft Entra ID (OIDC, no stored secret)
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to the Visual Studio Marketplace
        env:
          VERSION: ${{ needs.release.outputs.version }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          USE_ENTRA: ${{ vars.AZURE_CLIENT_ID != '' }}
          VSCE_PAT: ${{ vars.AZURE_CLIENT_ID == '' && secrets.VSCE_PAT || '' }}
        run: |
          VSCE="npx --yes @vscode/vsce@3.9.2"
          # Idempotent: a version published by hand must not fail the release.
          if $VSCE show peter-dolkens.vineyard --json | node -e '
            let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);process.exit((j.versions||[]).some(v=>v.version===process.env.VERSION)?0:1)})'; then
            echo "v$VERSION is already on the Marketplace; skipping"; exit 0
          fi
          if [ "$USE_ENTRA" = "true" ]; then
            $VSCE publish --packagePath "vineyard-$VERSION.vsix" --azure-credential
          elif [ -n "$VSCE_PAT" ]; then
            echo "::warning::Publishing with VSCE_PAT; set AZURE_CLIENT_ID / AZURE_TENANT_ID to switch to Entra ID before 2026-12-01"
            $VSCE publish --packagePath "vineyard-$VERSION.vsix" -p "$VSCE_PAT"
          else
            echo "::error::No Marketplace credential: set AZURE_CLIENT_ID and AZURE_TENANT_ID (repository variables)"; exit 1
          fi
